<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой тестовый сайт</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: #1f2937;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 24px;
    }

    button {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    #counter {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Привет, GitHub Pages! 👋</h1>
    <p>Если вы видите эту страницу по адресу <code>github.io</code>, значит сайт успешно опубликован.</p>
    <button id="btn">Нажми меня</button>
    <div id="counter">Нажатий: 0</div>
  </main>

  <script>
    let count = 0;
    const counter = document.getElementById('counter');

    document.getElementById('btn').addEventListener('click', () => {
      count++;
      counter.textContent = 'Нажатий: ' + count;
    });
  </script>
</body>
</html>
